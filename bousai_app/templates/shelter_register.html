{% extends "base.html" %}

{% block content %}
<section class="page-card">
<h2 class="page-title">避難所登録</h2>
<p class="page-description">新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p class="form-message">{{ message }}</p>
{% endif %}

{% if error %}
  <p class="form-message error">{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p><button type="submit">登録</button></p>
</form>
</section>
{% endblock %}
