{% extends "base.html" %}

{% block title %}管理者ログイン{% endblock %}

{% block content %}
<section class="page-card">
<h2 class="page-title">管理者ログイン</h2>
<p class="page-description">指示ボード・避難所登録の利用には管理者権限が必要です。</p>

{% if error %}
  <p class="form-message error">{{ message }}</p>
{% endif %}

<form method="post">
  <!-- リダイレクト先URLを保持 -->
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <p>
    <label for="password">パスワード（「123」と入力してください）</label><br>
    <input type="password" id="password" name="password" required>
  </p>

  <p><button type="submit">ログイン</button></p>
</form>

</section>
{% endblock %}
