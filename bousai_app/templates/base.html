<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand-blue: #2f5eaf;
      --text-blue: #2859a5;
      --success-green: #249447;
      --page-background: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #4e5d70;
      background: var(--page-background);
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .site-header {
      position: relative;
      z-index: 10000;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100% - 1380px) / 2));
      color: #fff;
      background: var(--brand-blue);
    }

    .site-title {
      margin: 0;
      color: #fff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .menu-button {
      border: 0;
      cursor: pointer;
      color: #fff;
      background: transparent;
      font-size: 28px;
      line-height: 1;
    }

    .site-nav {
      display: none;
      position: fixed;
      top: 70px;
      right: max(24px, calc((100% - 1380px) / 2));
      z-index: 20000;
      min-width: 210px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 4px 14px rgba(57, 87, 125, 0.18);
    }

    .site-nav.is-open {
      display: block;
    }

    .site-nav a {
      display: block;
      padding: 9px 0;
      color: var(--text-blue);
      text-decoration: none;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    .page-card {
      padding: 30px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(57, 87, 125, 0.08);
    }

    .page-title {
      margin: 0 0 12px;
      color: var(--text-blue);
      font-size: 26px;
    }

    .page-description {
      margin: 0 0 24px;
      color: #68778a;
    }

    .primary-link,
    form button {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 11px 20px;
      color: #fff;
      background: var(--brand-blue);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .primary-link:hover,
    form button:hover {
      background: #244d94;
    }

    form p { margin: 0 0 20px; }

    label {
      display: inline-block;
      margin-bottom: 8px;
      color: #3e5068;
      font-weight: 700;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: min(100%, 420px);
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #334155;
      font: inherit;
    }

    input:focus {
      outline: 2px solid rgba(47, 94, 175, 0.25);
      border-color: var(--brand-blue);
    }

    select:focus {
      outline: 2px solid rgba(47, 94, 175, 0.25);
      border-color: var(--brand-blue);
    }

    .search-options {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .search-options select { width: 210px; }

    .name-preview {
      position: relative;
      display: grid;
      gap: 5px;
      width: min(100%, 420px);
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid #cbd8e9;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(57, 87, 125, 0.14);
      color: #68778a;
      font-size: 13px;
    }

    .name-preview::before {
      position: absolute;
      top: -7px;
      left: 22px;
      width: 12px;
      height: 12px;
      border-top: 1px solid #cbd8e9;
      border-left: 1px solid #cbd8e9;
      background: #fff;
      content: "";
      transform: rotate(45deg);
    }

    .preview-name-link {
      color: var(--text-blue);
      font-weight: 700;
      text-decoration: none;
      border: 0;
      padding: 0;
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .preview-name-link:hover,
    .preview-name-link:focus-visible { text-decoration: underline; }

    .live-results { margin-top: 24px; }

    .live-results-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .live-results-heading .page-title { margin-bottom: 18px; }

    #resultCount { color: #68778a; font-size: 14px; font-weight: 700; }

    .live-shelter-link {
      width: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .live-shelter-link:hover,
    .live-shelter-link:focus-visible { background: #f2f7ff; }

    .search-checks {
      display: flex;
      gap: 20px;
      margin: 0 0 20px;
      padding: 14px;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
    }

    .search-checks legend {
      padding: 0 6px;
      color: #3e5068;
      font-weight: 700;
    }

    .search-checks label {
      margin: 0;
      font-weight: 400;
    }

    .search-checks input { accent-color: var(--brand-blue); }

    .form-message {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #eef5ff;
      color: var(--text-blue);
    }

    .form-message.error {
      background: #fff1f1;
      color: #b42318;
    }

    .result-list {
      margin: 0 0 24px;
      padding: 0;
      list-style: none;
    }

    .result-list li {
      padding: 14px 16px;
      border-bottom: 1px solid #e5eaf1;
      color: #3e5068;
    }

    .result-list li:first-child { border-top: 1px solid #e5eaf1; }

    .shelter-result {
      position: relative;
      padding: 0 !important;
    }

    .shelter-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      color: var(--text-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .shelter-link:hover,
    .shelter-link:focus-visible {
      background: #f2f7ff;
      text-decoration: underline;
    }

    .shelter-arrow {
      color: #7c96bb;
      font-size: 24px;
      line-height: 1;
    }

    .shelter-tooltip {
      position: absolute;
      top: calc(100% - 2px);
      left: 16px;
      z-index: 10;
      display: none;
      width: min(330px, calc(100% - 32px));
      padding: 14px 16px;
      border: 1px solid #cbd8e9;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(57, 87, 125, 0.18);
    }

    .shelter-tooltip::before {
      position: absolute;
      top: -7px;
      left: 22px;
      width: 12px;
      height: 12px;
      border-top: 1px solid #cbd8e9;
      border-left: 1px solid #cbd8e9;
      background: #fff;
      content: "";
      transform: rotate(45deg);
    }

    .shelter-result:hover .shelter-tooltip,
    .shelter-link:focus + .shelter-tooltip {
      display: grid;
      gap: 6px;
    }

    .shelter-tooltip strong { color: var(--text-blue); }

    .subtle-link {
      color: var(--text-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .subtle-link:hover { text-decoration: underline; }

    .detail-link {
      color: var(--text-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .detail-link:hover { text-decoration: underline; }

    .shelter-detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      margin: 0 0 24px;
      border: 1px solid #e5eaf1;
      background: #e5eaf1;
    }

    .shelter-detail-list div {
      padding: 16px;
      background: #fff;
    }

    .shelter-detail-list dt {
      margin-bottom: 6px;
      color: #68778a;
      font-size: 13px;
    }

    .shelter-detail-list dd {
      margin: 0;
      color: #3e5068;
      font-weight: 700;
    }

    .detail-location {
      margin: 0;
      color: #68778a;
      font-size: 13px;
    }

    .search-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 0.8fr);
      gap: 24px;
      align-items: start;
    }

    .map-search-card {
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(57, 87, 125, 0.08);
    }

    .map-search-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .map-search-heading .page-title {
      margin-bottom: 6px;
      font-size: 21px;
    }

    .map-search-heading p,
    .map-note {
      margin: 0;
      color: #68778a;
      font-size: 13px;
    }

    .map-area-label {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      color: #2859a5;
      background: #eef5ff;
      font-size: 12px;
      font-weight: 700;
    }

    #searchMap {
      height: 360px;
      overflow: hidden;
      border-radius: 10px;
    }

    .map-note { margin-top: 10px; }

    .notice-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    .notice-table th,
    .notice-table td {
      padding: 13px 15px;
      border-bottom: 1px solid #e5eaf1;
      text-align: left;
    }

    .notice-table th {
      color: #fff;
      background: var(--brand-blue);
    }

    .notice-table tr:last-child td { border-bottom: 0; }

    main {
      width: min(910px, calc(100% - 32px));
      margin: 32px auto 80px;
    }

    @media (max-width: 600px) {
      .site-header { height: 62px; }
      .site-title { font-size: 21px; }
      main { width: min(100% - 20px, 910px); margin-top: 20px; }
      .site-nav { top: 62px; right: 10px; }
      .page-card { padding: 20px; }
      .page-title { font-size: 22px; }
      .search-checks { display: grid; gap: 10px; }
      .search-layout { display: block; }
      .map-search-card { margin-top: 20px; padding: 20px; }
      #searchMap { height: 290px; }
      .shelter-detail-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">防災アプリ</h1>
    <button class="menu-button" id="menuButton" type="button" aria-label="メニュー" aria-expanded="false">☰</button>
  </header>

  <nav class="site-nav" id="siteNav">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuButton = document.getElementById('menuButton');
      const siteNav = document.getElementById('siteNav');

      menuButton.addEventListener('click', function() {
        const isOpen = siteNav.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
      });
    });
  </script>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
