{% extends "base.html" %}

{% block content %}
<section class="page-card">
<h2 class="page-title">検索結果</h2>

{% if results %}
  <ul class="result-list">
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a class="subtle-link" href="/shelter_search">検索画面に戻る</a>
  <span>　</span>
  <a class="subtle-link" href="/">トップページへ戻る</a>
</p>
</section>
{% endblock %}
